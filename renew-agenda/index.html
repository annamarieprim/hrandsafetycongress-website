<style>
.ag { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; color: #1A2621; font-size: 18px; line-height: 1.55; }
.ag a { color: #0F3E2D; }
.ag-wrap { max-width: 1200px; margin: 0 auto; padding: 56px 24px 72px; }
.ag-grid { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 40px; align-items: start; }
.ag-side { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 14px; }
.ag-side-h { margin: 0 0 2px; font-family: 'Playfair Display', Georgia, serif; font-size: 24px; color: #0F3E2D; }
.ag-body { flex: 1 1 auto; min-width: 0; }
.ag-desc { margin: 5px 0 0; font-size: 14px; line-height: 1.45; color: #5B6B64; }
.ag-key .ag-desc { color: #C9DBD2; }
.ag-pills { flex: 0 0 auto; align-self: flex-start; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.ag-pill { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.ag-pill-reflect { background: #E4EEE9; color: #0F3E2D; }
.ag-pill-reconnect { background: #FFFFFF; color: #2F5E4A; border: 1px solid #8FB09B; }
.ag-pill-grow { background: #0F3E2D; color: #D5A939; }
.ag-key .ag-pill-grow { background: #D5A939; color: #082B1E; }
.ag-pill-renew { background: #FFFFFF; color: #0F3E2D; border: 1px solid #D5A939; }
.ag-pill-grace { background: #FFFFFF; color: #7A5A0E; border: 1px solid #E0C376; }
.ag-sc { border-radius: 10px; padding: 16px 18px; background: #FFFFFF; border: 1px solid #D5E7DE; border-top: 4px solid #0F3E2D; }
.ag-sc-k { margin: 0; font-weight: 800; font-size: 14px; letter-spacing: .14em; color: #0F3E2D; }
.ag-sc-t { margin: 6px 0 0; font-size: 15px; line-height: 1.5; color: #33443D; }
.ag-sc-n { margin: 8px 0 0; font-size: 13px; font-style: italic; color: #5B6B64; }
.ag-sc-reflect { border-top-color: #0F3E2D; }
.ag-sc-reconnect { background: #EAF3EE; border-color: #C9DDD2; border-top-color: #6F9A86; }
.ag-sc-grow { background: #0F3E2D; border-color: #0F3E2D; border-top-color: #D5A939; }
.ag-sc-grow .ag-sc-k { color: #D5A939; } .ag-sc-grow .ag-sc-t { color: #E8F0EC; }
.ag-sc-grace { background: #FBF4E2; border-color: #EAD9A6; border-top: 4px solid #D5A939; }
@media (max-width: 1000px) { .ag-grid { grid-template-columns: 1fr; } .ag-side { position: static; order: -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); } .ag-side-h { grid-column: 1 / -1; } }
.ag-list { list-style: none; margin: 0; padding: 0; position: relative; }
.ag-list::before { content: ''; position: absolute; left: 118px; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: linear-gradient(#D5A939, #E9CF85 50%, #D5A939); }
.ag-row, .ag-t { display: grid; grid-template-columns: 100px 1fr; gap: 0 40px; align-items: center; position: relative; }
.ag-row { margin: 14px 0; }
.ag-row::before { content: ''; position: absolute; left: 112px; top: 50%; width: 15px; height: 15px; margin-top: -7.5px; border-radius: 50%; background: #FFFFFF; border: 3px solid #D5A939; box-sizing: border-box; }
.ag-key::before { background: #D5A939; }
.ag-time { font-weight: 700; font-size: 15px; color: #0F3E2D; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ag-card { display: flex; align-items: center; gap: 16px; background: #FFFFFF; border: 1px solid #D5E7DE; border-left: 4px solid #0F3E2D; border-radius: 8px; padding: 14px 18px; }
.ag-key .ag-card { background: #0F3E2D; border-color: #0F3E2D; border-left-color: #D5A939; color: #FFFFFF; }
.ag-ph { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; flex: 0 0 56px; border: 2px solid #D5A939; }
.ag-k { margin: 0; font-weight: 800; font-size: 14px; letter-spacing: .12em; color: #8A6A12; }
.ag-key .ag-k { color: #D5A939; }
.ag-who { margin: 2px 0 0; font-size: 18px; font-weight: 600; color: #0F3E2D; }
.ag-key .ag-who { color: #FFFFFF; }
.ag-t { margin: 2px 0; }
.ag-t .ag-time { font-weight: 500; font-size: 13px; color: #6B7F75; }
.ag-tline { font-size: 14px; color: #5B6B64; padding: 4px 0 4px 2px; }
.ag-tline em { font-style: italic; color: #3E5A4D; }
.ag-reconrow .ag-card { background: #EAF3EE; border-color: #C9DDD2; border-left-color: #6F9A86; }
.ag-reconrow::before { border-color: #6F9A86; background: #EAF3EE; }
.ag-gracerow .ag-card { background: #FBF4E2; border-color: #EAD9A6; border-left-color: #D5A939; }
.ag-gracerow .ag-desc { color: #6E6247; }
.ag-gracerow::before { border-color: #D5A939; background: #FBF4E2; }
.ag-soft { border-style: dashed; border-left-style: solid; }
.ag-note { margin: 2px 0 0; font-size: 14px; font-style: italic; color: #5B6B64; }
.ag-grace { position: relative; overflow: hidden; border-radius: 10px; padding: 26px 26px; background: linear-gradient(135deg, #0F3E2D, #14513B); color: #FFFFFF; border: 2px solid #D5A939; }
.ag-grace .ag-k { color: #D5A939; position: relative; z-index: 6; }
.ag-grace-h { margin: 8px 0 4px; font-family: 'Playfair Display', Georgia, serif; font-size: 26px; line-height: 1.25; color: #FFFFFF; position: relative; z-index: 6; }
.ag-grace .ag-who { color: #DCE9E2; font-weight: 500; font-size: 15px; position: relative; z-index: 6; }
@media (max-width: 640px) {
  .ag-list::before { left: 7px; }
  .ag-row, .ag-t { grid-template-columns: 1fr; gap: 4px; padding-left: 28px; }
  .ag-row::before { left: 1px; top: 12px; margin-top: 0; }
  .ag-time { text-align: left; }
  .ag-card { flex-wrap: wrap; }
  .ag-pills { order: -1; flex-basis: 100%; flex-direction: row; align-items: center; }
  .ag-grace-h { font-size: 22px; }
}
@media print {
  header, footer, .ag-side, .ag-desc, canvas, #hsc-chat, #hsc-chat-btn { display: none !important; }
  .ag-grid { display: block; }
  .ag-hero { background: #FFFFFF !important; color: #0F3E2D !important; padding: 0 0 10px !important; }
  .ag-hero * { color: #0F3E2D !important; }
  @page { margin: 0.4in 0.5in; }
  .ag-hero > div { padding: 0 !important; }
  .ag-hero h1 { font-size: 34px !important; }
  .ag-hero p { margin-top: 2px !important; margin-bottom: 2px !important; font-size: 12px !important; }
  .ag-wrap { padding: 6px 0 0; }
  .ag-list::before { left: 88px; }
  .ag-row, .ag-t { grid-template-columns: 72px 1fr; gap: 0 30px; }
  .ag-row::before { left: 82px; width: 12px; height: 12px; margin-top: -6px; }
  .ag-row { margin: 3px 0; break-inside: avoid; }
  .ag-t { margin: 0; }
  .ag-time { font-size: 11px; }
  .ag-t .ag-time { font-size: 10px; }
  .ag-card { padding: 4px 10px; gap: 10px; }
  .ag-k { font-size: 9.5px; }
  .ag-who { font-size: 12.5px; margin: 0; }
  .ag-tline { font-size: 10.5px; padding: 1px 0; }
  .ag-ph { width: 28px; height: 28px; flex-basis: 28px; }
  .ag-pill { font-size: 8px; padding: 1px 6px; }
  .ag-pills { flex-direction: row; align-self: center; }
  .ag-note { font-size: 10px; margin: 0; }
  .ag-key .ag-card, .ag-grace { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
