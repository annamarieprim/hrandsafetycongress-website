<script>
/* RENEW agenda: a few eucalyptus leaves drift in the green banner (waits for the page to be unlocked) */
(function () {
  if (window.__agLeaves) return; window.__agLeaves = true;
  var greens = ['#8FB09B', '#A7C3B1', '#6F9A86', '#9DB8B0', '#B9CFBE'];

    if (!el) return;

        p = { x: initial ? Math.random() * W : W + s * 2, y: H * (0.2 + Math.random() * 0.6), vx: -(0.25 + Math.random() * 0.3) * dpr, vy: 0,
          sway: (4 + Math.random() * 6) * dpr };

        p = { x: Math.random() * W, y: initial ? Math.random() * H * 0.6 : -s * 2, vx: 0, vy: (0.35 + Math.random() * 0.45) * dpr,
          sway: (18 + Math.random() * 30) * dpr };
      }
      p.s = s; p.ph = Math.random() * 6.28; p.sp = 0.006 + Math.random() * 0.006; p.r = Math.random() * 6.28;
      p.vr = (Math.random() - 0.5) * 0.012; p.flip = Math.random() * 6.28; p.c = greens[Math.floor(Math.random() * greens.length)];
      p.a = opts.alpha + Math.random() * 0.25; p.off = 0;

<script>
/* RENEW agenda: theme highlight, a gold leaf that travels the timeline as you scroll, and a "Now" marker on event day.
