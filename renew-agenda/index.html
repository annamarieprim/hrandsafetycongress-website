<script>
/* RENEW agenda: a few eucalyptus leaves drift in the green banner (waits for the page to be unlocked) */
(function () {
  if (window.__agLeaves) return; window.__agLeaves = true;
  var greens = ['#8FB09B', '#A7C3B1', '#6F9A86', '#9DB8B0', '#B9CFBE'];

    if (!el) return;
    if (getComputedStyle(el).position === 'static') el.style.position = 'relative';

    function size() { W = c.width = el.clientWidth * dpr; H = c.height = el.clientHeight * dpr; }
    size(); addEventListener('resize', size); setTimeout(size, 1500);
    if ('IntersectionObserver' in window) new IntersectionObserver(function (e) { visible = e[0].isIntersecting; }).observe(el); else visible = true;
    var leaves = [], MAX = innerWidth < 700 ? opts.maxM : opts.max, next = 0;
    function spawn(t, initial) {
      var s = (opts.min + Math.random() * (opts.maxS - opts.min)) * dpr, p;
      if (opts.across) {
        /* menu bar: leaves float sideways on a light breeze */
        p = { x: initial ? Math.random() * W : W + s * 2, y: H * (0.2 + Math.random() * 0.6), vx: -(0.25 + Math.random() * 0.3) * dpr, vy: 0,
          sway: (4 + Math.random() * 6) * dpr };
      } else {
        p = { x: Math.random() * W, y: initial ? Math.random() * H * 0.6 : -s * 2, vx: 0, vy: (0.35 + Math.random() * 0.45) * dpr,
          sway: (18 + Math.random() * 30) * dpr };
      }
      p.s = s; p.ph = Math.random() * 6.28; p.sp = 0.006 + Math.random() * 0.006; p.r = Math.random() * 6.28;
      p.vr = (Math.random() - 0.5) * 0.012; p.flip = Math.random() * 6.28; p.c = greens[Math.floor(Math.random() * greens.length)];
      p.a = opts.alpha + Math.random() * 0.25; p.off = 0;
      leaves.push(p); next = t + opts.gap + Math.random() * opts.gap * 1.5;
    }
    function draw(p) {
      var s = p.s, w = s * 0.62 * (0.35 + 0.65 * Math.abs(Math.cos(p.flip)));
      ctx.save();
      if (opts.across) ctx.translate(p.x, p.y + p.off); else ctx.translate(p.x + p.off, p.y);

      ctx.strokeStyle = p.c; ctx.lineWidth = Math.max(1, dpr); ctx.beginPath(); ctx.moveTo(0, s); ctx.lineTo(0, s * 1.25); ctx.stroke();

        for (var i = leaves.length - 1; i >= 0; i--) {

<script>
/* RENEW agenda: theme highlight, a gold leaf that travels the timeline as you scroll, and a "Now" marker on event day.
   Everything waits until the page is unlocked (the locked page fires hsc-unlocked). */
(function () {
  if (window.__agAnim) return; window.__agAnim = true;
  var EVENT_DAY = '2027-05-21';
  function mins(t, isEnd) { if (/until/i.test(t)) return 24 * 60; var p = t.split(':'), h = +p[0], m = +p[1]; if (h < 7) h += 12; return h * 60 + m; }
  function start() {
    var list = document.getElementById('ag-list');
    if (!list) { addEventListener('hsc-unlocked', start, { once: true }); return; }
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    /* 7. theme highlight */
    var grid = list.closest('.ag-grid') || document.body, picks = document.querySelectorAll('.ag-sc[data-pick]'), current = '';
    function pick(k) {
      current = current === k ? '' : k;
      grid.classList.toggle('ag-picking', !!current);
      picks.forEach(function (c) { var on = c.getAttribute('data-pick') === current; c.classList.toggle('ag-sel', on); c.setAttribute('aria-pressed', on ? 'true' : 'false'); });
      list.querySelectorAll('.ag-row').forEach(function (r) { r.classList.toggle('ag-hl', !!current && (' ' + r.getAttribute('data-th') + ' ').indexOf(' ' + current + ' ') > -1); });
    }
    picks.forEach(function (c) {
      c.addEventListener('click', function () { pick(c.getAttribute('data-pick')); });
      c.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(c.getAttribute('data-pick')); } });
    });
    /* 4. happening now (event day only, San Antonio time) */
    function nowCheck() {
      var f = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Chicago', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
      var d = window.__agNow || new Date(), parts = {}; f.formatToParts(d).forEach(function (x) { parts[x.type] = x.value; });
      var day = parts.year + '-' + parts.month + '-' + parts.day, m = (+parts.hour % 24) * 60 + (+parts.minute);
      list.querySelectorAll('.ag-row').forEach(function (r) {
        var t = (r.getAttribute('data-time') || '').split('–'), on = day === EVENT_DAY && t.length === 2 && m >= mins(t[0]) && m < mins(t[1], true);
        r.classList.toggle('ag-now', on);
        var k = r.querySelector('.ag-k'), tag = r.querySelector('.ag-nowtag');

        if (!on && tag) tag.remove();

    }
    nowCheck(); setInterval(nowCheck, 30000);
    /* 3. travelling leaf */
    if (reduce) return;
    var ns = 'http://www.w3.org/2000/svg', leaf = document.createElementNS(ns, 'svg');
    leaf.setAttribute('viewBox', '0 0 26 26'); leaf.setAttribute('class', 'ag-leaf'); leaf.setAttribute('aria-hidden', 'true');
    leaf.innerHTML = '<path d="M4 22 C4 11 11 4 22 4 C22 15 15 22 4 22 Z" fill="#D5A939"/><path d="M5 21 L19 7" stroke="#FFF4CC" stroke-width="1.4" stroke-linecap="round"/>';
    list.appendChild(leaf);
    var y = 0, target = 0, t0 = performance.now();
    function aim() { var r = list.getBoundingClientRect(); target = Math.max(8, Math.min(r.height - 8, innerHeight * 0.45 - r.top)); }

      y += (target - y) * 0.12;

      leaf.style.transform = 'translate(' + sway + 'px,' + y + 'px) rotate(' + Math.max(-60, Math.min(60, rot)) + 'deg)';
      requestAnimationFrame(frame);
    })(t0);
  }
  if (document.readyState === 'complete') start(); else addEventListener('load', start);
