/* RENEW agenda: a few eucalyptus leaves drift in the green banner (waits for the page to be unlocked) */
(function () {
  if (window.__agLeaves) return; window.__agLeaves = true;
  var greens = ['#8FB09B', '#A7C3B1', '#6F9A86', '#9DB8B0', '#B9CFBE'];
  function zone(el, opts) {
    if (!el) return;
    if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
    var c = document.createElement('canvas');
    c.setAttribute('aria-hidden', 'true');
    c.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5';
    el.appendChild(c);

    function size() { W = c.width = el.clientWidth * dpr; H = c.height = el.clientHeight * dpr; }

    if ('IntersectionObserver' in window) new IntersectionObserver(function (e) { visible = e[0].isIntersecting; }).observe(el); else visible = true;

    function spawn(t, initial) {
      var s = (opts.min + Math.random() * (opts.maxS - opts.min)) * dpr, p;
      if (opts.across) {
        /* menu bar: leaves float sideways on a light breeze */
        p = { x: initial ? Math.random() * W : W + s * 2, y: H * (0.2 + Math.random() * 0.6), vx: -(0.25 + Math.random() * 0.3) * dpr, vy: 0,
          sway: (4 + Math.random() * 6) * dpr };
      } else {
        p = { x: Math.random() * W, y: initial ? Math.random() * H * 0.6 : -s * 2, vx: 0, vy: (0.35 + Math.random() * 0.45) * dpr,
          sway: (18 + Math.random() * 30) * dpr };
      }
      p.s = s; p.ph = Math.random() * 6.28; p.sp = 0.006 + Math.random() * 0.006; p.r = Math.random() * 6.28;
      p.vr = (Math.random() - 0.5) * 0.012; p.flip = Math.random() * 6.28; p.c = greens[Math.floor(Math.random() * greens.length)];
      p.a = opts.alpha + Math.random() * 0.25; p.off = 0;
      leaves.push(p); next = t + opts.gap + Math.random() * opts.gap * 1.5;
    }

      var s = p.s, w = s * 0.62 * (0.35 + 0.65 * Math.abs(Math.cos(p.flip)));

      ctx.strokeStyle = p.c; ctx.lineWidth = Math.max(1, dpr); ctx.beginPath(); ctx.moveTo(0, s); ctx.lineTo(0, s * 1.25); ctx.stroke();

<script>
/* RENEW agenda: theme highlight, a gold leaf that travels the timeline as you scroll, and a "Now" marker on event day.

(function () {
  if (window.__agAnim) return; window.__agAnim = true;
  var EVENT_DAY = '2027-05-21';

    }
    picks.forEach(function (c) {
      c.addEventListener('click', function () { pick(c.getAttribute('data-pick')); });
      c.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(c.getAttribute('data-pick')); } });
    });
    /* 4. happening now (event day only, San Antonio time) */
    function nowCheck() {
      var f = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Chicago', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });

    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u(D.s), iterations: 250000, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u(D.i) }, key, u(D.c));
    return new TextDecoder().decode(pt);
  }
  function show(html) {
    document.getElementById('lock').remove();
    var t = document.createElement('div'); t.innerHTML = html; document.body.appendChild(t);
    t.querySelectorAll('script').forEach(function (o) { var n = document.createElement('script'); n.textContent = o.textContent; o.replaceWith(n); });
    window.dispatchEvent(new Event('hsc-unlocked'));
  }
  var saved; try { saved = sessionStorage.getItem('renewAg'); } catch (e) {}
  if (saved) open(saved).then(show).catch(function () {});
  document.getElementById('lock-form').addEventListener('submit', function (e) {
    e.preventDefault(); var pw = document.getElementById('lock-pw').value, err = document.getElementById('lock-err');
    err.textContent = 'Checking…';
    open(pw).then(function (h) { try { sessionStorage.setItem('renewAg', pw); } catch (x) {} show(h); })
      .catch(function () { err.textContent = 'That password isn’t right. Please try again.'; });
  });
})();
</script>
